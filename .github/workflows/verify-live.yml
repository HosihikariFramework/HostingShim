name: verify-live

# 真机冒烟：下载 BDS、装 Endstone 与 Release 附件里的载体，起服、列插件、停服。
on:
  workflow_dispatch:
    inputs:
      endstone_bds_version:
        description: 'BDS version for Endstone'
        required: true
        default: '1.26.52.3'
      levilamina_bds_version:
        description: 'BDS version for LeviLamina'
        required: true
        default: '1.26.51.1'
      selfhosted_bds_version:
        description: 'BDS version for self-hosted Linux'
        required: true
        default: '1.21.3.01'
      source:
        description: 'Linux: build the carrier from this checkout instead of using the release asset'
        type: boolean
        default: false
      version:
        description: 'Shim version (defaults to the latest release), e.g. 1.1.0'
        required: false
        default: ''
      core_version:
        description: 'Core version (defaults to the latest release), e.g. 1.1.0'
        required: false
        default: ''
      selfhosted:
        description: 'Linux: run the self-hosted carrier instead of the Endstone jobs'
        type: boolean
        default: false
      selfhosted_windows:
        description: 'Windows: run the self-hosted carrier instead of the parented jobs'
        type: boolean
        default: false

jobs:
  windows:
    name: Endstone / Windows
    if: ${{ !inputs.source && !inputs.selfhosted && !inputs.selfhosted_windows }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BDS_VERSION: ${{ inputs.endstone_bds_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 下载 BDS
        shell: pwsh
        run: |
          $server = Join-Path $env:RUNNER_TEMP 'server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Invoke-WebRequest -Uri "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-$env:BDS_VERSION.zip" `
            -OutFile "$env:RUNNER_TEMP\bds.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\bds.zip" -DestinationPath $server -Force
          'eula=true' | Set-Content -Path (Join-Path $server 'eula.txt') -Encoding ASCII
          "SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Endstone
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\endstone-venv"
          & "$env:RUNNER_TEMP\endstone-venv\Scripts\python.exe" -m pip install --quiet endstone==0.11.14
          "ENDSTONE_EXE=$env:RUNNER_TEMP\endstone-venv\Scripts\endstone.exe" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装载体
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shim = $env:SHIM_VERSION
          if (-not $shim) {
            $shim = (gh release view --repo HosihikariFramework/HostingShim --json tagName -q .tagName) -replace '^v', ''
          }
          $core = $env:CORE_VERSION
          if (-not $core) {
            $core = (gh release view --repo HosihikariFramework/PluginManager --json tagName -q .tagName) -replace '^v', ''
          }
          Set-Location $env:SERVER
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/HostingShim/releases/download/v$shim/hosihikari-endstone-windows-x64.zip" -OutFile "$env:RUNNER_TEMP\shim.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\shim.zip" -DestinationPath $env:SERVER -Force
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/PluginManager/releases/download/v$core/hosihikari-core-$core.zip" -OutFile "$env:RUNNER_TEMP\core.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\core.zip" -DestinationPath $env:SERVER -Force
          if (-not (Test-Path 'plugins/hosihikari.dll')) { throw 'the carrier dll is missing' }
          if (-not (Test-Path 'nethost.dll')) { throw 'nethost.dll is missing' }
          if (-not (Test-Path 'plugins/hosihikari/Hosihikari.PluginManager.dll')) { throw 'the core package is missing' }

      - name: 冒烟
        shell: pwsh
        run: pwsh -File Shim/carriers/endstone/smoke-live.ps1 -ServerRoot $env:SERVER

  levilamina:
    name: LeviLamina / Windows
    if: ${{ !inputs.source && !inputs.selfhosted && !inputs.selfhosted_windows }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BDS_VERSION: ${{ inputs.levilamina_bds_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - name: 下载 BDS
        shell: pwsh
        run: |
          $server = Join-Path $env:RUNNER_TEMP 'server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Invoke-WebRequest -Uri "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-$env:BDS_VERSION.zip" `
            -OutFile "$env:RUNNER_TEMP\bds.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\bds.zip" -DestinationPath $server -Force
          'eula=true' | Set-Content -Path (Join-Path $server 'eula.txt') -Encoding ASCII
          "SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: lip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/LiteLDev/lip/releases/download/v0.34.9/lip-0.34.9-win-x64.zip" `
            -OutFile "$env:RUNNER_TEMP\lip.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\lip.zip" -DestinationPath "$env:RUNNER_TEMP\lip" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\lip" -Recurse -Filter lip.exe | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装载体
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shim = $env:SHIM_VERSION
          if (-not $shim) {
            $shim = (gh release view --repo HosihikariFramework/HostingShim --json tagName -q .tagName) -replace '^v', ''
          }
          $core = $env:CORE_VERSION
          if (-not $core) {
            $core = (gh release view --repo HosihikariFramework/PluginManager --json tagName -q .tagName) -replace '^v', ''
          }
          Set-Location $env:SERVER
          lip install github.com/LiteLDev/LeviLamina@26.51.9
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/HostingShim/releases/download/v$shim/hosihikari-levilamina-windows-x64.zip" -OutFile "$env:RUNNER_TEMP\shim.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\shim.zip" -DestinationPath $env:SERVER -Force
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/PluginManager/releases/download/v$core/hosihikari-core-$core.zip" -OutFile "$env:RUNNER_TEMP\core.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\core.zip" -DestinationPath $env:SERVER -Force
          if (-not (Test-Path 'bedrock_server_mod.exe')) { throw 'LeviLamina did not produce bedrock_server_mod.exe' }
          if (-not (Test-Path 'plugins/hosihikari/Hosihikari.PluginManager.dll')) { throw 'the core package is missing' }

      - name: 冒烟
        shell: pwsh
        run: pwsh -File Shim/carriers/levilamina/smoke-live.ps1 -ServerRoot $env:SERVER

  linux:
    name: Endstone / Linux
    if: ${{ !inputs.selfhosted && !inputs.selfhosted_windows }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BDS_VERSION: ${{ inputs.endstone_bds_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # source 模式测未发布的改动：核心与契约并列 checkout，载体从本仓编。
      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager

      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v6
        if: ${{ inputs.source }}
        with:
          dotnet-version: '10.0.x'

      - name: 下载 BDS
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/server"
          mkdir -p "$server"
          curl -fsSL -A 'Mozilla/5.0' -o "$RUNNER_TEMP/bds.zip" \
            "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-$BDS_VERSION.zip"
          unzip -q "$RUNNER_TEMP/bds.zip" -d "$server"
          chmod +x "$server/bedrock_server"
          echo 'eula=true' > "$server/eula.txt"
          echo "SERVER=$server" >> "$GITHUB_ENV"

      - name: Endstone
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/endstone-venv"
          "$RUNNER_TEMP/endstone-venv/bin/pip" install --quiet endstone==0.11.14
          echo "ENDSTONE_EXE=$RUNNER_TEMP/endstone-venv/bin/endstone" >> "$GITHUB_ENV"

      - name: Clang 与 libc++
        if: ${{ inputs.source }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: 托管核心
        if: ${{ inputs.source }}
        run: dotnet build PluginManager/src/Hosihikari.PluginManager.csproj -c Release

      - name: 源码构建载体
        if: ${{ inputs.source }}
        run: Shim/carriers/endstone/build.sh

      - name: 源码装配
        if: ${{ inputs.source }}
        run: Shim/carriers/endstone/deploy.sh "$SERVER"

      - name: 安装载体
        if: ${{ !inputs.source }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          set -euo pipefail
          shim="$SHIM_VERSION"
          if [ -z "$shim" ]; then
            shim=$(gh release view --repo HosihikariFramework/HostingShim --json tagName -q .tagName)
            shim=${shim#v}
          fi
          core="$CORE_VERSION"
          if [ -z "$core" ]; then
            core=$(gh release view --repo HosihikariFramework/PluginManager --json tagName -q .tagName)
            core=${core#v}
          fi
          cd "$SERVER"
          curl -fsSL "https://github.com/HosihikariFramework/HostingShim/releases/download/v$shim/hosihikari-endstone-linux-x64.zip" -o "$RUNNER_TEMP/shim.zip"
          curl -fsSL "https://github.com/HosihikariFramework/PluginManager/releases/download/v$core/hosihikari-core-$core.zip" -o "$RUNNER_TEMP/core.zip"
          unzip -qo "$RUNNER_TEMP/shim.zip" -d "$SERVER"
          unzip -qo "$RUNNER_TEMP/core.zip" -d "$SERVER"
          test -f plugins/hosihikari.so
          test -f plugins/libnethost.so
          test -f plugins/hosihikari/Hosihikari.PluginManager.dll
          ls -l plugins/hosihikari.so plugins/libnethost.so
          readelf -d plugins/hosihikari.so | grep -E 'RPATH|RUNPATH' || true
          ldd plugins/hosihikari.so || true

      - name: 冒烟
        run: |
          set -euo pipefail
          chmod +x Shim/carriers/endstone/smoke.sh
          Shim/carriers/endstone/smoke.sh "$SERVER"

  selfhosted-linux:
    name: 自持态 / Linux
    if: ${{ inputs.selfhosted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BDS_VERSION: ${{ inputs.selfhosted_bds_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager

      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      - uses: actions/checkout@v7
        if: ${{ inputs.source }}
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        if: ${{ inputs.source }}
        with:
          dotnet-version: '10.0.x'

      - name: 下载 BDS
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/server with space"
          mkdir -p "$server"
          curl -fsSL -A 'Mozilla/5.0' -o "$RUNNER_TEMP/bds.zip" \
            "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-$BDS_VERSION.zip"
          unzip -q "$RUNNER_TEMP/bds.zip" -d "$server"
          chmod +x "$server/bedrock_server"
          echo 'eula=true' > "$server/eula.txt"
          echo "SERVER=$server" >> "$GITHUB_ENV"

      - name: 托管核心
        if: ${{ inputs.source }}
        run: dotnet build PluginManager/src/Hosihikari.PluginManager.csproj -c Release

      - name: 构建自持态载体
        if: ${{ inputs.source }}
        run: Shim/carriers/selfhosted-linux/build.sh

      - name: 装配
        if: ${{ inputs.source }}
        run: Shim/carriers/selfhosted-linux/deploy.sh "$SERVER"

      - name: 安装载体
        if: ${{ !inputs.source }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          set -euo pipefail
          shim="$SHIM_VERSION"
          if [ -z "$shim" ]; then
            shim=$(gh release view --repo HosihikariFramework/HostingShim --json tagName -q .tagName)
            shim=${shim#v}
          fi
          core="$CORE_VERSION"
          if [ -z "$core" ]; then
            core=$(gh release view --repo HosihikariFramework/PluginManager --json tagName -q .tagName)
            core=${core#v}
          fi
          cd "$SERVER"
          curl -fsSL "https://github.com/HosihikariFramework/HostingShim/releases/download/v$shim/hosihikari-selfhosted-linux-x64.zip" -o "$RUNNER_TEMP/shim.zip"
          curl -fsSL "https://github.com/HosihikariFramework/PluginManager/releases/download/v$core/hosihikari-core-$core.zip" -o "$RUNNER_TEMP/core.zip"
          unzip -qo "$RUNNER_TEMP/shim.zip" -d "$SERVER"
          unzip -qo "$RUNNER_TEMP/core.zip" -d "$SERVER"
          chmod +x hosihikari-server
          test -f plugins/hosihikari/libhosihikari.so
          test -f plugins/hosihikari/libnethost.so
          test -f plugins/hosihikari/Hosihikari.PluginManager.dll
          test -x hosihikari-server

      - name: 冒烟
        run: |
          set -euo pipefail
          chmod +x Shim/carriers/selfhosted-linux/smoke.sh
          Shim/carriers/selfhosted-linux/smoke.sh "$SERVER"

  selfhosted-windows:
    name: 自持态 / Windows
    if: ${{ inputs.selfhosted_windows }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BDS_VERSION: ${{ inputs.selfhosted_bds_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - name: 下载 BDS
        shell: pwsh
        run: |
          $server = Join-Path $env:RUNNER_TEMP 'server'
          New-Item -ItemType Directory -Force $server | Out-Null
          Invoke-WebRequest -Uri "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-$env:BDS_VERSION.zip" `
            -OutFile "$env:RUNNER_TEMP\bds.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\bds.zip" -DestinationPath $server -Force
          'eula=true' | Set-Content -Path (Join-Path $server 'eula.txt') -Encoding ASCII
          "SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装载体
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_VERSION: ${{ inputs.version }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shim = $env:SHIM_VERSION
          if (-not $shim) {
            $shim = (gh release view --repo HosihikariFramework/HostingShim --json tagName -q .tagName) -replace '^v', ''
          }
          $core = $env:CORE_VERSION
          if (-not $core) {
            $core = (gh release view --repo HosihikariFramework/PluginManager --json tagName -q .tagName) -replace '^v', ''
          }
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/HostingShim/releases/download/v$shim/hosihikari-selfhosted-windows-x64.zip" -OutFile "$env:RUNNER_TEMP\shim.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\shim.zip" -DestinationPath $env:SERVER -Force
          Invoke-WebRequest -Uri "https://github.com/HosihikariFramework/PluginManager/releases/download/v$core/hosihikari-core-$core.zip" -OutFile "$env:RUNNER_TEMP\core.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\core.zip" -DestinationPath $env:SERVER -Force
          Remove-Item (Join-Path $env:SERVER 'sei.json') -ErrorAction SilentlyContinue
          foreach ($file in @('hosihikari-server.exe', 'plugins/hosihikari/hosihikari.dll', 'plugins/hosihikari/Hosihikari.PluginManager.dll')) {
            if (-not (Test-Path (Join-Path $env:SERVER $file))) { throw "missing $file" }
          }

      - name: 冒烟
        shell: pwsh
        run: pwsh -File Shim/carriers/selfhosted-windows/smoke.ps1 -ServerRoot $env:SERVER -DelaySeconds 45
