name: verify-providers

# 发布后的 Provider 安装验收：在 Linux 与 Windows 上用真实 lip 装 Shim、Core 与三个 Provider，
# 检查目录、清单与共享层排除。运行期行为由各 Provider 的宿主断言覆盖。
on:
  workflow_dispatch:
    inputs:
      shim_version:
        description: 'Shim version'
        required: true
        default: '0.7.0'
      core_version:
        description: 'Core version'
        required: true
        default: '0.7.2'
      csharp_version:
        description: 'C# Provider version'
        required: true
        default: '0.2.3'
      fsharp_version:
        description: 'F# Provider version'
        required: true
        default: '0.1.4'
      rpc_version:
        description: 'RPC Provider version'
        required: true
        default: '0.2.4'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 lip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lip"
          curl -fsSL -o "$RUNNER_TEMP/lip.tar.xz" \
            https://github.com/LiteLDev/lip/releases/download/v0.34.9/lip-0.34.9-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/lip.tar.xz" -C "$RUNNER_TEMP/lip"
          chmod +x "$RUNNER_TEMP/lip/lip"
          echo "$RUNNER_TEMP/lip" >> "$GITHUB_PATH"

      - name: 安装载体与 Provider
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          lip install "github.com/HosihikariFramework/PluginManagement@${{ inputs.core_version }}"
          lip install "github.com/HosihikariFramework/Shim#endstone@${{ inputs.shim_version }}"
          lip install "github.com/HosihikariFramework/CSharpProvider@${{ inputs.csharp_version }}"
          lip install "github.com/HosihikariFramework/FSharpProvider@${{ inputs.fsharp_version }}"
          lip install "github.com/HosihikariFramework/RpcProvider@${{ inputs.rpc_version }}"

      - name: 检查落盘
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          test -f plugins/hosihikari/Hosihikari.PluginManager.dll
          test -f plugins/hosihikari-csharp/Hosihikari.PluginProvider.CSharp.dll
          test -f plugins/hosihikari-fsharp/Hosihikari.PluginProvider.FSharp.dll
          test -f plugins/hosihikari-rpc/Hosihikari.PluginProvider.Rpc.dll
          test "$(jq -r .name plugins/hosihikari-csharp/manifest.json)" = hosihikari-csharp
          test "$(jq -r .name plugins/hosihikari-fsharp/manifest.json)" = hosihikari-fsharp
          test "$(jq -r .name plugins/hosihikari-rpc/manifest.json)" = hosihikari-rpc
          if find plugins/hosihikari-csharp plugins/hosihikari-fsharp plugins/hosihikari-rpc \
              -name 'Hosihikari.Abstractions.dll' | grep -q .; then
            echo 'a provider package contains the shared contract' >&2
            exit 1
          fi
          find plugins -maxdepth 2 -type f | sort

  windows:
    runs-on: windows-latest
    steps:
      - name: 安装 lip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/LiteLDev/lip/releases/download/v0.34.9/lip-0.34.9-win-x64.zip' -OutFile "$env:RUNNER_TEMP\lip.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\lip.zip" -DestinationPath "$env:RUNNER_TEMP\lip"
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\lip" -Filter lip.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'lip.exe not found' }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装载体与 Provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\install" | Out-Null
          Set-Location "$env:RUNNER_TEMP\install"
          lip install "github.com/HosihikariFramework/PluginManagement@${{ inputs.core_version }}"
          lip install "github.com/HosihikariFramework/Shim#endstone@${{ inputs.shim_version }}"
          lip install "github.com/HosihikariFramework/CSharpProvider@${{ inputs.csharp_version }}"
          lip install "github.com/HosihikariFramework/FSharpProvider@${{ inputs.fsharp_version }}"
          lip install "github.com/HosihikariFramework/RpcProvider@${{ inputs.rpc_version }}"

      - name: 检查落盘
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:RUNNER_TEMP\install"
          $required = @(
            'plugins/hosihikari/Hosihikari.PluginManager.dll',
            'plugins/hosihikari-csharp/Hosihikari.PluginProvider.CSharp.dll',
            'plugins/hosihikari-fsharp/Hosihikari.PluginProvider.FSharp.dll',
            'plugins/hosihikari-rpc/Hosihikari.PluginProvider.Rpc.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "missing $file" }
          }
          $manifests = @{
            'plugins/hosihikari-csharp/manifest.json' = 'hosihikari-csharp'
            'plugins/hosihikari-fsharp/manifest.json' = 'hosihikari-fsharp'
            'plugins/hosihikari-rpc/manifest.json' = 'hosihikari-rpc'
          }
          foreach ($path in $manifests.Keys) {
            $name = (Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).name
            if ($name -ne $manifests[$path]) { throw "$path has name $name" }
          }
          $shared = Get-ChildItem -Path plugins/hosihikari-csharp,plugins/hosihikari-fsharp,plugins/hosihikari-rpc -Recurse -Filter Hosihikari.Abstractions.dll
          if ($shared) { throw 'a provider package contains the shared contract' }
          Get-ChildItem -Path plugins -Recurse -File | ForEach-Object { $_.FullName }
