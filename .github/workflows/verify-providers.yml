name: verify-providers

# 发布后的 Loader 安装验收：在 Linux 与 Windows 上下载真实 Release 附件装 Shim、Core 与三个
# Loader，检查目录、清单与共享层排除。运行期行为由各 Loader 的宿主断言覆盖。
on:
  workflow_dispatch:
    inputs:
      shim_version:
        description: 'Shim version'
        required: true
        default: '1.2.0'
      core_version:
        description: 'Core version'
        required: true
        default: '1.2.0'
      csharp_version:
        description: 'C# Loader version'
        required: true
        default: '1.0.0'
      fsharp_version:
        description: 'F# Loader version'
        required: true
        default: '1.0.0'
      rpc_version:
        description: 'RPC Loader version'
        required: true
        default: '1.0.0'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: 安装载体与 Loader
        env:
          CORE: ${{ inputs.core_version }}
          SHIM: ${{ inputs.shim_version }}
          CSHARP: ${{ inputs.csharp_version }}
          FSHARP: ${{ inputs.fsharp_version }}
          RPC: ${{ inputs.rpc_version }}
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/install"
          mkdir -p "$install"
          base=https://github.com/HosihikariFramework
          curl -fsSL "$base/PluginManager/releases/download/v$CORE/hosihikari-core-$CORE.zip" -o "$RUNNER_TEMP/core.zip"
          curl -fsSL "$base/HostingShim/releases/download/v$SHIM/hosihikari-endstone-linux-x64.zip" -o "$RUNNER_TEMP/shim.zip"
          curl -fsSL "$base/CSharpLoader/releases/download/v$CSHARP/hosihikari-csharp-$CSHARP.zip" -o "$RUNNER_TEMP/csharp.zip"
          curl -fsSL "$base/FSharpLoader/releases/download/v$FSHARP/hosihikari-fsharp-$FSHARP.zip" -o "$RUNNER_TEMP/fsharp.zip"
          curl -fsSL "$base/RpcLoader/releases/download/v$RPC/hosihikari-rpc-$RPC.zip" -o "$RUNNER_TEMP/rpc.zip"
          for zip in core shim csharp fsharp rpc; do
            unzip -q "$RUNNER_TEMP/$zip.zip" -d "$install"
          done

      - name: 检查落盘
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          test -f plugins/hosihikari/Hosihikari.PluginManager.dll
          test -f plugins/hosihikari-csharp/Hosihikari.PluginLoader.CSharp.dll
          test -f plugins/hosihikari-fsharp/Hosihikari.PluginLoader.FSharp.dll
          test -f plugins/hosihikari-rpc/Hosihikari.PluginLoader.Rpc.dll
          test "$(jq -r .name plugins/hosihikari-csharp/manifest.json)" = hosihikari-csharp
          test "$(jq -r .name plugins/hosihikari-fsharp/manifest.json)" = hosihikari-fsharp
          test "$(jq -r .name plugins/hosihikari-rpc/manifest.json)" = hosihikari-rpc
          if find plugins/hosihikari-csharp plugins/hosihikari-fsharp plugins/hosihikari-rpc \
              -name 'Hosihikari.Plugin.Abstractions.dll' | grep -q .; then
            echo 'a loader package contains the shared contract' >&2
            exit 1
          fi
          find plugins -maxdepth 2 -type f | sort

  windows:
    runs-on: windows-latest
    steps:
      - name: 安装载体与 Loader
        shell: pwsh
        env:
          CORE: ${{ inputs.core_version }}
          SHIM: ${{ inputs.shim_version }}
          CSHARP: ${{ inputs.csharp_version }}
          FSHARP: ${{ inputs.fsharp_version }}
          RPC: ${{ inputs.rpc_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $install = "$env:RUNNER_TEMP\install"
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          $base = 'https://github.com/HosihikariFramework'
          $assets = [ordered]@{
            core   = "$base/PluginManager/releases/download/v$env:CORE/hosihikari-core-$env:CORE.zip"
            shim   = "$base/HostingShim/releases/download/v$env:SHIM/hosihikari-endstone-windows-x64.zip"
            csharp = "$base/CSharpLoader/releases/download/v$env:CSHARP/hosihikari-csharp-$env:CSHARP.zip"
            fsharp = "$base/FSharpLoader/releases/download/v$env:FSHARP/hosihikari-fsharp-$env:FSHARP.zip"
            rpc    = "$base/RpcLoader/releases/download/v$env:RPC/hosihikari-rpc-$env:RPC.zip"
          }
          foreach ($name in $assets.Keys) {
            $path = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest -Uri $assets[$name] -OutFile $path
            Expand-Archive -Path $path -DestinationPath $install -Force
          }

      - name: 检查落盘
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:RUNNER_TEMP\install"
          $required = @(
            'plugins/hosihikari/Hosihikari.PluginManager.dll',
            'plugins/hosihikari-csharp/Hosihikari.PluginLoader.CSharp.dll',
            'plugins/hosihikari-fsharp/Hosihikari.PluginLoader.FSharp.dll',
            'plugins/hosihikari-rpc/Hosihikari.PluginLoader.Rpc.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "missing $file" }
          }
          $manifests = @{
            'plugins/hosihikari-csharp/manifest.json' = 'hosihikari-csharp'
            'plugins/hosihikari-fsharp/manifest.json' = 'hosihikari-fsharp'
            'plugins/hosihikari-rpc/manifest.json' = 'hosihikari-rpc'
          }
          foreach ($path in $manifests.Keys) {
            $name = (Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).name
            if ($name -ne $manifests[$path]) { throw "$path has name $name" }
          }
          $shared = Get-ChildItem -Path plugins/hosihikari-csharp,plugins/hosihikari-fsharp,plugins/hosihikari-rpc -Recurse -Filter Hosihikari.Plugin.Abstractions.dll
          if ($shared) { throw 'a loader package contains the shared contract' }
          Get-ChildItem -Path plugins -Recurse -File | ForEach-Object { $_.FullName }
