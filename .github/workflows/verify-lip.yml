name: verify-lip

# 发布后用真实 Linux 平台装一遍 lip 变体：变体名、平台匹配与 placement
# 在 Windows 上验不了（lip 按当前 RID 过滤变体）。
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package spec, e.g. github.com/HosihikariFramework/HostingShim#endstone'
        required: true
        default: 'github.com/HosihikariFramework/HostingShim#endstone'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 lip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lip"
          curl -fsSL -o "$RUNNER_TEMP/lip.tar.xz" \
            https://github.com/LiteLDev/lip/releases/download/v0.34.9/lip-0.34.9-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/lip.tar.xz" -C "$RUNNER_TEMP/lip"
          chmod +x "$RUNNER_TEMP/lip/lip"
          echo "$RUNNER_TEMP/lip" >> "$GITHUB_PATH"

      - name: 安装变体
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          lip install "${{ inputs.package }}"

      - name: 检查落盘
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          test -f plugins/hosihikari.so
          test -f plugins/libnethost.so
          test -f plugins/hosihikari/Hosihikari.PluginManager.dll
          test -f plugins/hosihikari/Hosihikari.PluginManager.runtimeconfig.json
          find plugins -maxdepth 2 -type f | sort
