name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seam:
    name: 原生缝（host-glue / host-dll / injector）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # nethost 由 CMake 自己按版本从 nuget.org 取，不随仓带二进制。
      - name: 配置
        run: cmake -S verify -B verify/build -A x64

      - name: 构建
        run: cmake --build verify/build --config Release

  # Endstone 的 SDK 是纯头文件的 INTERFACE 库，这里只编我们自己的代码 —— 比 LeviLamina
  # 那个 job 轻得多（那边要把上游从源码编一遍）。
  carrier-endstone:
    name: 载体（Endstone / Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # endstone 与 nlohmann_json 由 CMake 浅克隆，nethost 从 nuget.org 取。
      - name: 构建
        shell: cmd
        run: carriers\endstone\build.bat

  # 载体这一步照官方模版（LiteLDev/levilamina-mod-template）的做法来：
  #   1. 钉住 LLVM 版本 —— liteldev 的 xmake-repo 没有 levilamina 的预编译包，装它等于
  #      在 runner 上把 LeviLamina 从源码编一遍，而它挑 clang 版本；runner 自带的那个
  #      在 LL 自己的源码上报类型不完整。换 MSVC 不成立 —— 那个端口指定的就是 clang-cl。
  #   2. 缓存 ~/AppData/Local/.xmake —— 那次源码构建很贵，之后就不必重来。
  carrier:
    name: 载体（LeviLamina / Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('carriers/levilamina/xmake.lua') }}
          restore-keys: xmake-

      # vcvars 由脚本用 vswhere 自己找；clang-cl 用上面装的那个（脚本只在找不到时才兜底）。
      # 依赖从 liteldev 的 xmake-repo 与 nuget.org 取，两者公网可达。
      - name: 构建
        shell: cmd
        run: carriers\levilamina\build.bat
