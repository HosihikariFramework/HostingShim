name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: 格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 仓库自带的配置文件与 FormatterConfig 逐字节相同，是标准；漂了就停下并打印 diff。
      # clang-format 版本钉死：新版本认不全新选项，--Werror 会把未知项也算失败。
      - name: C/C++
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(
            git ls-files -z -- '*.c' '*.cpp' '*.h' '*.hpp' | grep -zvE '/(build|bin|obj)/'
          )
          if [ ${#files[@]} -eq 0 ]; then echo "没有 C/C++ 文件"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install --quiet 'clang-format==23.1.4'
          "$RUNNER_TEMP/cf/bin/clang-format" --dry-run --Werror "${files[@]}"

      # .clang-format 管不到的规则由 .editorconfig 规定，这里查它 —— clang-format 不看
      # .editorconfig。行尾不查：检出是 CRLF、索引里是 LF，先把 CR 去掉再判行尾空白。
      - name: 空白
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files)
          fail=0
          for f in "${files[@]}"; do
            [ -s "$f" ] || continue
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "$f: 文件末尾缺换行"; fail=1
            fi
            if sed 's/\r$//' "$f" | grep -qE '[[:space:]]+$'; then
              echo "$f: 有行尾空白"; fail=1
            fi
          done
          exit "$fail"

      # .editorconfig 里的 csharp_* 规则只有 dotnet format 会执行。只放 whitespace：
      # style 那套会连 file_header_template 一起要求。
      # 本仓没有解决方案，--folder 让格式化器直接走源码目录（只有启动器那一个工程）。
      - name: C# 空白
        run: dotnet format whitespace --folder . --verify-no-changes

  smoke-negative:
    name: 冒烟拒绝非零退出
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 负向冒烟
        run: bash carriers/smoke-negative.sh

  smoke-negative-windows:
    name: Windows 冒烟拒绝非零退出
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 负向冒烟
        shell: pwsh
        run: pwsh -File carriers/smoke-negative.ps1

  seam:
    name: 原生缝（host-glue / host-dll / injector）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      # nethost 由 CMake 自己按版本从 nuget.org 取，不随仓带二进制。
      - name: 配置
        run: cmake -S verify -B verify/build -A x64

      - name: 构建
        run: cmake --build verify/build --config Release

  # Endstone 的 SDK 是纯头文件的 INTERFACE 库，这里只编我们自己的代码 —— 比 LeviLamina
  # 那个 job 轻得多（那边要把上游从源码编一遍）。
  carrier-endstone:
    name: 载体（Endstone / Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      # endstone 与 nlohmann_json 由 CMake 浅克隆，nethost 从 nuget.org 取。
      - name: 构建
        shell: cmd
        run: carriers\endstone\build.bat

  carrier-endstone-linux:
    name: 载体（Endstone / Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # deploy 要核心与 nethost 一起铺；三份并列 checkout 与发布工作流同形。
      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager
          # 跨仓并列检出跟 PR 目标分支。
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 托管核心
        run: dotnet build PluginManager/src/Hosihikari.PluginManager.csproj -c Release

      # Endstone SDK 在 UNIX 上钉住 libc++（与 BDS 的 ABI 对齐）；GCC 不认 -stdlib。
      - name: Clang 与 libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      # 与 Windows 那份共用同一套 CMake；nethost 换成 linux-x64 运行包。
      - name: 构建
        run: Shim/carriers/endstone/build.sh

      # 不等到打标签才发现 deploy 的落点不对。
      - name: 装配
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage-endstone-linux"
          Shim/carriers/endstone/deploy.sh "$stage"
          test -f "$stage/plugins/hosihikari.so"
          test -f "$stage/plugins/libnethost.so"
          test -f "$stage/plugins/hosihikari/Hosihikari.PluginManager.dll"
          test -f "$stage/plugins/hosihikari/Hosihikari.PluginManager.runtimeconfig.json"
          test -f "$stage/plugins/hosihikari/hosihikari.json"

  carrier-selfhosted-windows:
    name: 自持态（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 构建
        shell: cmd
        run: carriers\selfhosted-windows\build.bat

      - name: 装配
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage-selfhosted-windows'
          & carriers\selfhosted-windows\deploy.ps1 -ServerRoot $stage -ShimOnly
          foreach ($file in @('hosihikari-server.exe', 'plugins/hosihikari/hosihikari.dll', 'plugins/hosihikari/hosihikari.json')) {
            if (-not (Test-Path (Join-Path $stage $file))) { throw "missing $file" }
          }

  carrier-selfhosted-linux:
    name: 自持态（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager
          # 跨仓并列检出跟 PR 目标分支。
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 托管核心
        run: dotnet build PluginManager/src/Hosihikari.PluginManager.csproj -c Release

      - name: 构建
        run: Shim/carriers/selfhosted-linux/build.sh

      - name: 装配
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage-selfhosted-linux"
          Shim/carriers/selfhosted-linux/deploy.sh "$stage"
          test -f "$stage/plugins/hosihikari/libhosihikari.so"
          test -f "$stage/plugins/hosihikari/libnethost.so"
          test -f "$stage/plugins/hosihikari/Hosihikari.PluginManager.dll"
          test -f "$stage/plugins/hosihikari/hosihikari.json"
          test -x "$stage/hosihikari-server"

  # 载体这一步照官方模版（LiteLDev/levilamina-mod-template）的做法来：
  #   1. 钉住 LLVM 版本 —— liteldev 的 xmake-repo 没有 levilamina 的预编译包，装它等于
  #      在 runner 上把 LeviLamina 从源码编一遍，而它挑 clang 版本；runner 自带的那个
  #      在 LL 自己的源码上报类型不完整。换 MSVC 不成立 —— 那个端口指定的就是 clang-cl。
  #   2. 缓存 ~/AppData/Local/.xmake —— 那次源码构建很贵，之后就不必重来。
  carrier:
    name: 载体（LeviLamina / Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('carriers/levilamina/xmake.lua') }}
          restore-keys: xmake-

      # vcvars 由脚本用 vswhere 自己找；clang-cl 用上面装的那个（脚本只在找不到时才兜底）。
      # 依赖从 liteldev 的 xmake-repo 与 nuget.org 取，两者公网可达。
      - name: 构建
        shell: cmd
        run: carriers\levilamina\build.bat

      - name: 语言目录
        shell: pwsh
        run: pwsh -File carriers/levilamina/check-lang.ps1

      # deploy 的落点与载体清单同样不等打标签才发现。
      - name: 装配
        shell: cmd
        run: |
          carriers\levilamina\deploy.bat "%RUNNER_TEMP%\stage-levilamina" shim-only
          if not exist "%RUNNER_TEMP%\stage-levilamina\mods\hosihikari\hosihikari.json" exit /b 1
          if not exist "%RUNNER_TEMP%\stage-levilamina\mods\hosihikari\hosihikari.dll" exit /b 1

  # 投影载荷整条链（FX-0028）只有 release.yml 会跑，而它是标签触发的 —— PR 阶段
  # 没有任何东西证明钉值还能编、清单里的文件还产得出来。这里按同一段循环预先跑一遍，
  # 红了在合并前就能看到，不必等到打标签。
  payload:
    name: 投影载荷
    runs-on: windows-latest
    # 钉值与 release.yml 的 env 逐字相同，那边改了这里跟着改。两处都是跨仓提交，
    # 抄错一个就是 PR 绿、打标签才炸。
    env:
      CAPABILITIES_REF: 0a50fcb817418123351cec9b5b21d3ea7d4adc17
      BINDING_IDIOMATIC_REF: 52642a46b112f0f14fb4d6aed85b4426ffbd376d
      BINDING_ABI_REF: 2ee2a0d989f8cd1690077c1426ccf4beb1ec92c3
      BINDING_ENDSTONE_REF: 057b51506b035da5ff95a866884bf2c12f293035
      BINDING_GENERATOR_REF: e4d4087868f0ca4e8d85bf5b1a1f4945e08541f8
      BINDING_LEVILAMINA_REF: d43539420541b8ca3928ef1dd49c516e5051e0db
      PLUGIN_ABSTRACTIONS_REF: c350a23a2ce33b18c2355b4ce5767ac862608fe8
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # LeviLamina 只发 xmake 包，导入库只有用它自己的构建真编一遍才有。
      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Capabilities
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/Capabilities
          path: Projection/Capabilities
          ref: ${{ env.CAPABILITIES_REF }}

      - name: 投影绑定层
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingIdiomatic
          path: Projection/Binding.Idiomatic
          ref: ${{ env.BINDING_IDIOMATIC_REF }}

      - name: 投影 ABI 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingAbi
          path: Projection/Binding.Abi
          ref: ${{ env.BINDING_ABI_REF }}

      - name: Endstone 绑定
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/EndstoneBinding
          path: Projection/Binding.Endstone
          ref: ${{ env.BINDING_ENDSTONE_REF }}

      - name: LeviLamina 绑定
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/LeviLaminaBinding
          path: Projection/Binding.LeviLamina
          ref: ${{ env.BINDING_LEVILAMINA_REF }}

      # 垫片按两个载体的真实头文件编译：Endstone 的头从源码树取，LeviLamina 的要先
      # 出导入库与 compile_commands，两边都要 LLVM。缺哪样都在编垫片那步之前停下。
      - name: Endstone 头文件
        uses: actions/checkout@v7
        with:
          repository: EndstoneMC/endstone
          path: Projection/Third/Endstone
          ref: v0.11.16

      - name: LeviLamina 源码
        uses: actions/checkout@v7
        with:
          repository: LiteLDev/LeviLamina
          path: Projection/Third/LeviLamina
          ref: v26.60.9

      - name: expected-lite 头文件
        uses: actions/checkout@v7
        with:
          repository: martinmoene/expected-lite
          path: expected-lite
          ref: v0.9.0

      - name: nlohmann/json 头文件
        uses: actions/checkout@v7
        with:
          repository: nlohmann/json
          path: nlohmann-json
          ref: v3.11.3

      - name: 绑定生成器
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingGenerator
          path: Projection/Binding.Generator
          ref: ${{ env.BINDING_GENERATOR_REF }}

      - name: 契约仓
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Projection/Plugin.Abstractions
          ref: ${{ env.PLUGIN_ABSTRACTIONS_REF }}

      # 与 release.yml 的“投影托管载荷”一步同形：同一组跨仓属性、同一份工程名单。
      # 共享层两个载体共用，一次构建覆盖，来源唯一。
      - name: 投影托管载荷
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $proj = Join-Path $ws 'Projection'
          $out = Join-Path $ws 'payload'
          $shared = @(
            "-p:PluginAbstractionsProjectPath=$proj\Plugin.Abstractions\src\Hosihikari.Plugin.Abstractions.csproj",
            "-p:AbiProjectPath=$proj\Binding.Abi\src\Hosihikari.Binding.Abi\Hosihikari.Binding.Abi.csproj",
            "-p:EndstoneInteropProjectPath=$proj\Binding.Endstone\src\Hosihikari.Binding.Endstone.Interop\Hosihikari.Binding.Endstone.Interop.csproj",
            "-p:EndstoneIdiomaticProjectPath=$proj\Binding.Idiomatic\src\Hosihikari.Binding.Endstone\Hosihikari.Binding.Endstone.csproj",
            "-p:LeviLaminaInteropProjectPath=$proj\Binding.LeviLamina\src\Hosihikari.Binding.LeviLamina.Interop\Hosihikari.Binding.LeviLamina.Interop.csproj",
            "-p:LeviLaminaIdiomaticProjectPath=$proj\Binding.Idiomatic\src\Hosihikari.Binding.LeviLamina\Hosihikari.Binding.LeviLamina.csproj"
          )
          foreach ($name in @(
              'Hosihikari.Carrier.Endstone.Bootstrap',
              'Hosihikari.Extension.Event.Endstone',
              'Hosihikari.Extension.Async.Endstone',
              'Hosihikari.Extension.UI.Endstone',
              'Hosihikari.Carrier.LeviLamina.Bootstrap',
              'Hosihikari.Extension.Event.LeviLamina',
              # 没有组件，靠模块初始化器注册；没有别的工程会把它带出来，得自己编。
              'Hosihikari.Extension.Async.LeviLamina')) {
            dotnet build "$proj\Capabilities\src\$name\$name.csproj" -c Release -o $out -v q --nologo @shared
            if ($LASTEXITCODE -ne 0) { throw "building $name failed" }
          }

      # 清单里列的名字就是载荷里该有的文件；少一个就停下。自持面的清单仍是空载体组，
      # 这里只核两个带载荷的载体。
      - name: 清单核对
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $payload = Join-Path $root 'payload'
          foreach ($manifest in @(
              "$root\Shim\carriers\endstone\hosihikari.json",
              "$root\Shim\carriers\levilamina\hosihikari.json")) {
            $declared = (Get-Content $manifest -Raw | ConvertFrom-Json).carrier |
              ForEach-Object { @($_.sharedAssemblies) + @($_.components.assembly) + @($_.bootstrap.assembly) } |
              Where-Object { $_ } | Select-Object -Unique
            foreach ($name in $declared) {
              if (-not (Test-Path (Join-Path $payload $name))) { throw "the payload is missing $name" }
            }
          }

      # 垫片是载荷里唯一按载体头文件编出来的原生件；缺了它，两个载体的归档里那个
      # 原生 dll 就是空的。以下几步与 release.yml 同形：LLVM、两个依赖头文件的布局
      # 处理、各载体的头文件准备，都排在编垫片之前。
      - uses: actions/cache@v6
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/llvm.tar.xz
          key: llvm-23.1.0-windows-x64

      - name: 下载 LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\llvm.tar.xz" `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.xz"

      - name: 解压 LLVM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\llvm" | Out-Null
          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:GITHUB_WORKSPACE\llvm" --strip-components=1

      # 安装探针在 VS 18 的头文件上编不过，而这里只需要头文件本身：按脚本认的
      # 布局把源码直接放进 xmake 包目录，不装包。
      - name: 垫片依赖的头文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $packages = Join-Path $env:LOCALAPPDATA '.xmake\packages'
          $expected = Join-Path $packages 'e\expected-lite\release\include\nonstd'
          New-Item -ItemType Directory -Force $expected | Out-Null
          Copy-Item "$ws\expected-lite\include\nonstd\expected.hpp" $expected -Force
          $json = Join-Path $packages 'n\nlohmann_json\release\include\nlohmann'
          New-Item -ItemType Directory -Force $json | Out-Null
          Copy-Item "$ws\nlohmann-json\single_include\nlohmann\json.hpp" $json -Force

      - name: Endstone 版本头
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Projection'
          $version = '0.12.0'
          $match = Select-String -Path "$root\Third\Endstone\include\CMakeLists.txt" `
            -Pattern 'project\s*\(\s*endstone\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if ($match) { $version = $match.Matches[0].Groups[1].Value }
          $parts = $version.Split('.')
          # 无 BOM：带 BOM 的 UTF-8 会让 clang-cl 在第一行报莫名其妙的解析错。
          $header = Join-Path $root 'Binding.Generator\artifacts\endstone-generated\include\endstone\version.h'
          New-Item -ItemType Directory -Force (Split-Path $header -Parent) | Out-Null
          @"
          #pragma once
          #define ENDSTONE_VERSION_MAJOR $($parts[0])
          #define ENDSTONE_VERSION_MINOR $($parts[1])
          #define ENDSTONE_VERSION_PATCH $($parts[2])
          #define ENDSTONE_API_VERSION "$($parts[0]).$($parts[1])"
          #ifndef ENDSTONE_VERSION
          #define ENDSTONE_VERSION "$version"
          #endif
          "@ | Set-Content $header -Encoding utf8NoBOM

      - name: 构建 Endstone 绑定垫片
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          & "$ws\Projection\Binding.Endstone\native\BindingShim\build.ps1" `
            -EndstoneRoot "$ws\Projection\Third\Endstone" `
            -GeneratorRoot "$ws\Projection\Binding.Generator" `
            -LlvmRoot "$ws\llvm" `
            -Output "$ws\payload"
          if ($LASTEXITCODE -ne 0) { throw 'building the Endstone binding shim failed' }

      # 导入库只有对着真编一遍的 LeviLamina 才有；垫片脚本从 compile_commands.json
      # 取编译参数。
      - name: 构建 LeviLamina 源码
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ll = Join-Path $env:GITHUB_WORKSPACE 'Projection\Third\LeviLamina'
          Push-Location $ll
          try {
            xmake f -y -a x64 -m release -p windows --target_type=server
            if ($LASTEXITCODE -ne 0) { throw 'configuring LeviLamina failed' }
            xmake build -j8 LeviLamina
            if ($LASTEXITCODE -ne 0) { throw 'building LeviLamina failed' }
            xmake project -k compile_commands
            if ($LASTEXITCODE -ne 0) { throw 'writing compile_commands.json failed' }
          }
          finally {
            Pop-Location
          }

      - name: 构建 LeviLamina 绑定垫片
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          & "$ws\Projection\Binding.LeviLamina\native\BindingShim\build.ps1" `
            -LeviLaminaRoot "$ws\Projection\Third\LeviLamina" `
            -GeneratorRoot "$ws\Projection\Binding.Generator" `
            -LlvmRoot "$ws\llvm" `
            -Output "$ws\payload"
          if ($LASTEXITCODE -ne 0) { throw 'building the LeviLamina binding shim failed' }

