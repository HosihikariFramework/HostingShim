name: release

# 发布是刻意的动作：这个工作流只在打标签时跑。标签决定版本与附件名
# （v0.1.0 ↔ 0.1.0）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-assets:
    name: Windows 发布附件
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # 标签与两个载体报出的版本必须是同一个；漂了就在构建前停下。
      - name: 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''

          $levilamina = Get-Content Shim/carriers/levilamina/xmake.lua -Raw
          if (-not $levilamina.Contains("modVersion = `"$tag`"")) {
            throw "LeviLamina 载体的 modVersion 不是 $tag"
          }

          $endstone = Get-Content Shim/carriers/endstone/src/plugin.cpp -Raw
          if (-not $endstone.Contains("ENDSTONE_PLUGIN(`"hosihikari`", `"$tag`"")) {
            throw "Endstone 载体的版本不是 $tag"
          }

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('Shim/carriers/levilamina/xmake.lua') }}
          restore-keys: xmake-

      - name: 构建 LeviLamina 载体
        shell: cmd
        working-directory: Shim
        run: carriers\levilamina\build.bat

      - name: 构建 Endstone 载体
        shell: cmd
        working-directory: Shim
        run: carriers\endstone\build.bat

      - name: 构建自持态 Windows 载体
        shell: cmd
        working-directory: Shim
        run: carriers\selfhosted-windows\build.bat

      # 用各自的 deploy 脚本铺到空目录：铺出来的就是解压到服务端根目录期望的形状，
      # 发布物与本地部署因此不会悄悄分叉。
      - name: 装配 Windows 附件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $out  = Join-Path $root 'out'
          New-Item -ItemType Directory -Force $out | Out-Null

          & "$root\Shim\carriers\levilamina\deploy.bat" "$root\stage-levilamina" shim-only
          & "$root\Shim\carriers\endstone\deploy.bat"  "$root\stage-endstone" shim-only
          & "$root\Shim\carriers\selfhosted-windows\deploy.ps1" -ServerRoot "$root\stage-selfhosted-windows" -ShimOnly

          # tar 就是 bsdtar：-a 按扩展名压缩，-C 换目录后按名字收条目，
          # 这样 zip 顶层不会多出一层 ./ 或目录名。
          & tar -a -c -f "$out\hosihikari-levilamina-windows-x64.zip" `
                -C "$root\stage-levilamina" plugins
          if ($LASTEXITCODE -ne 0) { throw 'packaging the LeviLamina variant failed' }

          # Endstone 那份只带原生插件与 nethost；托管核心由独立 Core 附件落盘。
          & tar -a -c -f "$out\hosihikari-endstone-windows-x64.zip" `
                -C "$root\stage-endstone" plugins/hosihikari.dll nethost.dll
          if ($LASTEXITCODE -ne 0) { throw 'packaging the Endstone variant failed' }

          # 自持态那份是启动器加垫片；托管核心同样由 Core 附件落盘。
          & tar -a -c -f "$out\hosihikari-selfhosted-windows-x64.zip" `
                -C "$root\stage-selfhosted-windows" hosihikari-server.exe plugins/hosihikari
          if ($LASTEXITCODE -ne 0) { throw 'packaging the self-hosted Windows variant failed' }

          $expected = @{
            'hosihikari-levilamina-windows-x64.zip' = @(
              'plugins/hosihikari/hosihikari.dll',
              'plugins/hosihikari/manifest.json'
            )
            'hosihikari-endstone-windows-x64.zip' = @(
              'plugins/hosihikari.dll',
              'nethost.dll'
            )
            'hosihikari-selfhosted-windows-x64.zip' = @(
              'hosihikari-server.exe',
              'plugins/hosihikari/hosihikari.dll'
            )
          }
          foreach ($name in $expected.Keys) {
            $entries = & tar -tf (Join-Path $out $name) | ForEach-Object { $_ -replace '\\', '/' }
            foreach ($entry in $expected[$name]) {
              if ($entries -notcontains $entry) { throw "$name is missing $entry" }
            }
          }

          Get-ChildItem $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-assets
          path: out/*.zip

  linux-assets:
    name: Linux 发布附件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # Endstone SDK 在 UNIX 上钉住 libc++（与 BDS 的 ABI 对齐）；GCC 不认 -stdlib。
      - name: Clang 与 libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: 构建 Endstone 载体
        run: Shim/carriers/endstone/build.sh

      # 与 Windows 一样用 deploy 脚本铺出解压到服务端根目录期望的形状。
      - name: 装配附件
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          "$root/Shim/carriers/endstone/deploy.sh" "$root/stage-endstone-linux" shim-only

          mkdir -p "$root/out"
          (cd "$root/stage-endstone-linux" && zip -qr "$root/out/hosihikari-endstone-linux-x64.zip" plugins/hosihikari.so plugins/libnethost.so)

          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'plugins/hosihikari.so'
          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'plugins/libnethost.so'

          ls -l "$root/out"

      - name: 构建自持态载体
        run: Shim/carriers/selfhosted-linux/build.sh

      - name: 装配自持态附件
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          "$root/Shim/carriers/selfhosted-linux/deploy.sh" "$root/stage-selfhosted-linux" shim-only

          mkdir -p "$root/out"
          (cd "$root/stage-selfhosted-linux" && zip -qr "$root/out/hosihikari-selfhosted-linux-x64.zip" hosihikari-server plugins/hosihikari)

          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'hosihikari-server'
          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'plugins/hosihikari/libhosihikari.so'

          ls -l "$root/out"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: out/*.zip

  release:
    name: 发 release
    needs: [windows-assets, linux-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: out

      - name: 发 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workspace 根不是 git 仓库（几份 checkout 各在自己的子目录里），
          # 所以仓库要显式给：否则 --generate-notes 找不到上下文。
          gh release create "${{ github.ref_name }}" out/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes
