name: release

# 发布是刻意的动作：这个工作流只在打标签时跑。标签决定版本与附件名
# （v0.1.0 ↔ 0.1.0）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 投影载荷（ADR-0028）的跨仓提交钉在这里：载体归档里的托管共享层、载体组件
# 与绑定垫片全部按这些提交构建。升版时与 CapabilityExtension 的 verify.yml 成对改。
env:
  CAPABILITY_EXTENSION_REF: 02685a3b528f9bfb1a6a1a173e6ff2f9fb483dd7
  BINDING_IDIOMATIC_REF: 5ef1854df0c26070db014ffe24f819781a3cd822
  BINDING_ABI_REF: 0cefbb52067d31c8488269d2f1a701624c3a8729
  BINDING_ENDSTONE_REF: 53512018a19e895971e37543d37ed37b7511f186
  BINDING_GENERATOR_REF: d718503c85dea3d8d326df4496214cce98c9909b
  PLUGIN_ABSTRACTIONS_REF: 2e2c8fc1d794bb3ba78f73b3f90fbe338f5a0a30
  ENDSTONE_REF: v0.11.15

jobs:
  windows-assets:
    name: Windows 发布附件
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # 自持态 Windows 的启动器是 NativeAOT 项目，构建时要用 .NET SDK。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 标签与两个载体报出的版本必须是同一个；漂了就在构建前停下。
      - name: 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''

          $levilamina = Get-Content Shim/carriers/levilamina/xmake.lua -Raw
          if (-not $levilamina.Contains("modVersion = `"$tag`"")) {
            throw "LeviLamina 载体的 modVersion 不是 $tag"
          }

          $endstone = Get-Content Shim/carriers/endstone/src/plugin.cpp -Raw
          if (-not $endstone.Contains("ENDSTONE_PLUGIN(`"hosihikari`", `"$tag`"")) {
            throw "Endstone 载体的版本不是 $tag"
          }

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('Shim/carriers/levilamina/xmake.lua') }}
          restore-keys: xmake-

      - name: 构建 LeviLamina 载体
        shell: cmd
        working-directory: Shim
        run: carriers\levilamina\build.bat

      - name: 构建 Endstone 载体
        shell: cmd
        working-directory: Shim
        run: carriers\endstone\build.bat

      - name: 构建自持态 Windows 载体
        shell: cmd
        working-directory: Shim
        run: carriers\selfhosted-windows\build.bat

      # 投影载荷（ADR-0028）：Endstone 的载体归档从 v2 起带托管共享层、载体组件
      # 与服务配置器，另加绑定垫片。全部按上面的提交构建。
      - name: CapabilityExtension
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/CapabilityExtension
          path: Projection/CapabilityExtension
          ref: ${{ env.CAPABILITY_EXTENSION_REF }}

      - name: 投影绑定层
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingIdiomatic
          path: Projection/Binding.Idiomatic
          ref: ${{ env.BINDING_IDIOMATIC_REF }}

      - name: 投影 ABI 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingAbi
          path: Projection/Binding.Abi
          ref: ${{ env.BINDING_ABI_REF }}

      - name: Endstone 绑定
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/EndstoneBinding
          path: Projection/Binding.Endstone
          ref: ${{ env.BINDING_ENDSTONE_REF }}

      - name: 绑定生成器
        uses: actions/checkout@v7
        with:
          repository: HosihikariProjection/BindingGenerator
          path: Projection/Binding.Generator
          ref: ${{ env.BINDING_GENERATOR_REF }}

      - name: 契约仓
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Projection/Plugin.Abstractions
          ref: ${{ env.PLUGIN_ABSTRACTIONS_REF }}

      # 垫片按 Endstone 的头文件编译；版本号取自这套头文件。
      - name: Endstone 头文件
        uses: actions/checkout@v7
        with:
          repository: EndstoneMC/endstone
          path: Projection/Third/Endstone
          ref: ${{ env.ENDSTONE_REF }}

      - name: expected-lite 头文件
        uses: actions/checkout@v7
        with:
          repository: martinmoene/expected-lite
          path: expected-lite
          ref: v0.9.0

      - name: nlohmann/json 头文件
        uses: actions/checkout@v7
        with:
          repository: nlohmann/json
          path: nlohmann-json
          ref: v3.11.3

      # 垫片的编译脚本从 xmake 包目录里取这两个库的头文件。它们的安装探针
      # 在 VS 18 的头文件上编不过（C++14 语法的探针撞上按 C++11 编），而这里
      # 只需要头文件本身，所以按脚本认的布局把源码直接放进去，不装包。
      - name: 垫片依赖的头文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $packages = Join-Path $env:LOCALAPPDATA '.xmake\packages'
          $expected = Join-Path $packages 'e\expected-lite\release\include\nonstd'
          New-Item -ItemType Directory -Force $expected | Out-Null
          Copy-Item "$ws\expected-lite\include\nonstd\expected.hpp" $expected -Force
          $json = Join-Path $packages 'n\nlohmann_json\release\include\nlohmann'
          New-Item -ItemType Directory -Force $json | Out-Null
          Copy-Item "$ws\nlohmann-json\single_include\nlohmann\json.hpp" $json -Force

      - uses: actions/cache@v6
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/llvm.tar.xz
          key: llvm-23.1.0-windows-x64

      - name: 下载 LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\llvm.tar.xz" `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.xz"

      - name: 解压 LLVM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\llvm" | Out-Null
          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:GITHUB_WORKSPACE\llvm" --strip-components=1

      - name: 投影托管载荷
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $proj = Join-Path $ws 'Projection'
          $out = Join-Path $ws 'payload'
          # 共享层与组件的工程引用靠这几个属性跨仓指向，与 CapabilityExtension 的
          # verify.yml 同一组名字。
          $shared = @(
            "-p:PluginAbstractionsProjectPath=$proj\Plugin.Abstractions\src\Hosihikari.Plugin.Abstractions.csproj",
            "-p:AbiProjectPath=$proj\Binding.Abi\src\Hosihikari.Bindings.Abi\Hosihikari.Bindings.Abi.csproj",
            "-p:EndstoneInteropProjectPath=$proj\Binding.Endstone\src\Hosihikari.Bindings.Endstone.Interop\Hosihikari.Bindings.Endstone.Interop.csproj",
            "-p:EndstoneIdiomaticProjectPath=$proj\Binding.Idiomatic\src\Hosihikari.Binding.Endstone\Hosihikari.Binding.Endstone.csproj"
          )
          # 四个工程写进同一个输出目录；装配时按清单逐个核对，清单与载荷不会各说各话。
          foreach ($name in @(
              'Hosihikari.Carrier.Endstone.Bootstrap',
              'Hosihikari.Extension.Event.Endstone',
              'Hosihikari.Extension.Async.Endstone',
              'Hosihikari.Extension.UI.Endstone')) {
            dotnet build "$proj\CapabilityExtension\src\$name\$name.csproj" -c Release -o $out -v q --nologo @shared
            if ($LASTEXITCODE -ne 0) { throw "building $name failed" }
          }

      # 垫片只用到 Endstone 的公开头文件；缺的 version.h 由头文件里的版本号补。
      - name: Endstone 版本头
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Projection'
          $version = '0.12.0'
          $match = Select-String -Path "$root\Third\Endstone\include\CMakeLists.txt" `
            -Pattern 'project\s*\(\s*endstone\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if ($match) { $version = $match.Matches[0].Groups[1].Value }
          $parts = $version.Split('.')
          # 无 BOM：带 BOM 的 UTF-8 会让 clang-cl 在第一行报莫名其妙的解析错。
          $header = Join-Path $root 'Binding.Generator\artifacts\endstone-generated\include\endstone\version.h'
          New-Item -ItemType Directory -Force (Split-Path $header -Parent) | Out-Null
          @"
          #pragma once
          #define ENDSTONE_VERSION_MAJOR $($parts[0])
          #define ENDSTONE_VERSION_MINOR $($parts[1])
          #define ENDSTONE_VERSION_PATCH $($parts[2])
          #define ENDSTONE_API_VERSION "$($parts[0]).$($parts[1])"
          #ifndef ENDSTONE_VERSION
          #define ENDSTONE_VERSION "$version"
          #endif
          "@ | Set-Content $header -Encoding utf8NoBOM

      - name: 构建 Endstone 绑定垫片
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          & "$ws\Projection\Binding.Endstone\native\BindingShim\build.ps1" `
            -EndstoneRoot "$ws\Projection\Third\Endstone" `
            -GeneratorRoot "$ws\Projection\Binding.Generator" `
            -LlvmRoot "$ws\llvm" `
            -Output "$ws\payload"
          if ($LASTEXITCODE -ne 0) { throw 'building the Endstone binding shim failed' }

      # 用各自的 deploy 脚本铺到空目录：铺出来的就是解压到服务端根目录期望的形状，
      # 发布物与本地部署因此不会悄悄分叉。
      - name: 装配 Windows 附件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $out  = Join-Path $root 'out'
          $version = '${{ github.ref_name }}' -replace '^v', ''
          New-Item -ItemType Directory -Force $out | Out-Null

          & "$root\Shim\carriers\levilamina\deploy.bat" "$root\stage-levilamina" shim-only $version
          & "$root\Shim\carriers\endstone\deploy.bat"  "$root\stage-endstone" shim-only $version
          & "$root\Shim\carriers\selfhosted-windows\deploy.ps1" -ServerRoot "$root\stage-selfhosted-windows" -ShimOnly -Version $version

          # 投影载荷按载体清单入包（ADR-0028）：清单里列的名字就是包里该有的文件，
          # 少一个就停下——清单与载荷不能各说各话。LeviLamina 与自持面的清单还是空载体组。
          $carrier = (Get-Content "$root\Shim\carriers\endstone\hosihikari.json" -Raw | ConvertFrom-Json).carrier
          $declared = @($carrier.sharedAssemblies) + @($carrier.components.assembly) + @($carrier.bootstrap.assembly) |
            Where-Object { $_ } | Select-Object -Unique
          $payload = Join-Path $root 'payload'
          foreach ($name in $declared) {
            $file = Join-Path $payload $name
            if (-not (Test-Path $file)) { throw "the payload is missing $name" }
            Copy-Item $file "$root\stage-endstone\plugins\hosihikari\" -Force
          }
          Copy-Item (Join-Path $payload 'Hosihikari.Bindings.Endstone.Shim.dll') `
            "$root\stage-endstone\plugins\hosihikari\" -Force

          # 每个附件根部的 sei.json 是分发元数据；artifact.prerequisites 指向同名的
          # bundle sei，rid 区分平台。安装时根级 sei.json 被跳过。
          function Write-Sei([string]$dir, [string]$carrier, [string]$rid) {
            [ordered]@{
              schemaVersion = 3
              name          = 'hosihikari-hosting'
              version       = $version
              dependencies  = @([ordered]@{ name = 'hosihikari'; version = '[2.0.0,3.0.0)' })
              prerequisites = @()
              optionalPeers = @()
              conflicts     = @()
              artifact      = [ordered]@{
                rid           = $rid
                dependencies  = @()
                prerequisites = @([ordered]@{ name = $carrier; version = '*' })
                optionalPeers = @()
                conflicts     = @()
                layout        = 'root'
              }
            } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $dir 'sei.json') -Encoding utf8NoBOM
          }

          Write-Sei "$root\stage-levilamina" 'hosihikari-hosting-levilamina' 'win-x64'
          Write-Sei "$root\stage-endstone" 'hosihikari-hosting-endstone' 'win-x64'
          Write-Sei "$root\stage-selfhosted-windows" 'hosihikari-hosting-selfhosted' 'win-x64'

          # tar 就是 bsdtar：-a 按扩展名压缩，-C 换目录后按名字收条目，
          # 这样 zip 顶层不会多出一层 ./ 或目录名。
          & tar -a -c -f "$out\hosihikari-levilamina-windows-x64.zip" `
                -C "$root\stage-levilamina" mods sei.json
          if ($LASTEXITCODE -ne 0) { throw 'packaging the LeviLamina variant failed' }

          # Endstone 那份带原生插件、nethost、载体清单与投影载荷；托管核心由独立 Core 附件落盘。
          & tar -a -c -f "$out\hosihikari-endstone-windows-x64.zip" `
                -C "$root\stage-endstone" plugins/hosihikari.dll plugins/hosihikari nethost.dll sei.json
          if ($LASTEXITCODE -ne 0) { throw 'packaging the Endstone variant failed' }

          # 自持态那份是启动器加垫片；托管核心同样由 Core 附件落盘。
          & tar -a -c -f "$out\hosihikari-selfhosted-windows-x64.zip" `
                -C "$root\stage-selfhosted-windows" hosihikari-server.exe plugins/hosihikari sei.json
          if ($LASTEXITCODE -ne 0) { throw 'packaging the self-hosted Windows variant failed' }

          $expected = @{
            'hosihikari-levilamina-windows-x64.zip' = @(
              'mods/hosihikari/hosihikari.dll',
              'mods/hosihikari/hosihikari.json',
              'mods/hosihikari/manifest.json',
              'mods/hosihikari/lang/ar.json',
              'mods/hosihikari/lang/en.json',
              'mods/hosihikari/lang/es.json',
              'mods/hosihikari/lang/fr.json',
              'mods/hosihikari/lang/ru.json',
              'mods/hosihikari/lang/zh.json',
              'sei.json'
            )
            'hosihikari-endstone-windows-x64.zip' = @(
              'plugins/hosihikari.dll',
              'plugins/hosihikari/hosihikari.json',
              'nethost.dll',
              'sei.json'
            )
            'hosihikari-selfhosted-windows-x64.zip' = @(
              'hosihikari-server.exe',
              'plugins/hosihikari/hosihikari.dll',
              'plugins/hosihikari/hosihikari.json',
              'sei.json'
            )
          }
          foreach ($name in $expected.Keys) {
            $entries = & tar -tf (Join-Path $out $name) | ForEach-Object { $_ -replace '\\', '/' }
            foreach ($entry in $expected[$name]) {
              if ($entries -notcontains $entry) { throw "$name is missing $entry" }
            }
          }

          # 载体清单声明了什么，包里就得有什么：清单与载荷一起发，少一个都不行。
          $carrier = (Get-Content "$root\Shim\carriers\endstone\hosihikari.json" -Raw | ConvertFrom-Json).carrier
          $declared = @($carrier.sharedAssemblies) + @($carrier.components.assembly) + @($carrier.bootstrap.assembly) |
            Where-Object { $_ } | Select-Object -Unique
          $entries = & tar -tf (Join-Path $out 'hosihikari-endstone-windows-x64.zip') | ForEach-Object { $_ -replace '\\', '/' }
          foreach ($name in @($declared) + @('Hosihikari.Bindings.Endstone.Shim.dll')) {
            if ($entries -notcontains "plugins/hosihikari/$name") {
              throw "the Endstone archive is missing plugins/hosihikari/$name"
            }
          }

          Get-ChildItem $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-assets
          path: out/*.zip

  linux-assets:
    name: Linux 发布附件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Shim

      # Endstone SDK 在 UNIX 上钉住 libc++（与 BDS 的 ABI 对齐）；GCC 不认 -stdlib。
      - name: Clang 与 libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: 构建 Endstone 载体
        run: Shim/carriers/endstone/build.sh

      # 与 Windows 一样用 deploy 脚本铺出解压到服务端根目录期望的形状。
      - name: 装配附件
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          version="${GITHUB_REF_NAME#v}"
          "$root/Shim/carriers/endstone/deploy.sh" "$root/stage-endstone-linux" shim-only "$version"

          # Linux 的绑定垫片要 Linux IR 的发射链，工具链还得与 Endstone 的 libc++ ABI
          # 对齐——投影那边只有编译，没有 Linux 运行时冒烟。这条链在本作业里落地之前，
          # Linux 包声明空载体组，装上去的组件也就不会缺垫片。
          jq '(.carrier.sharedAssemblies = []) | (.carrier.components = []) | del(.carrier.bootstrap)' \
            "$root/stage-endstone-linux/plugins/hosihikari/hosihikari.json" > "$root/stage-endstone-linux/plugins/hosihikari/manifest.tmp"
          mv "$root/stage-endstone-linux/plugins/hosihikari/manifest.tmp" \
             "$root/stage-endstone-linux/plugins/hosihikari/hosihikari.json"

          sei() {
            jq -n --arg version "$version" --arg carrier "$1" --arg rid "$2" '{
              schemaVersion: 3,
              name: "hosihikari-hosting",
              version: $version,
              dependencies: [{ name: "hosihikari", version: "[2.0.0,3.0.0)" }],
              prerequisites: [],
              optionalPeers: [],
              conflicts: [],
              artifact: {
                rid: $rid,
                dependencies: [],
                prerequisites: [{ name: $carrier, version: "*" }],
                optionalPeers: [],
                conflicts: [],
                layout: "root"
              }
            }' > "$3"
          }

          sei hosihikari-hosting-endstone linux-x64 "$root/stage-endstone-linux/sei.json"

          mkdir -p "$root/out"
          (cd "$root/stage-endstone-linux" && zip -qr "$root/out/hosihikari-endstone-linux-x64.zip" plugins/hosihikari.so plugins/hosihikari/hosihikari.json plugins/libnethost.so sei.json)

          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'plugins/hosihikari.so'
          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'plugins/hosihikari/hosihikari.json'
          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'plugins/libnethost.so'
          unzip -l "$root/out/hosihikari-endstone-linux-x64.zip" | grep -q 'sei.json'

          ls -l "$root/out"

      - name: 构建自持态载体
        run: Shim/carriers/selfhosted-linux/build.sh

      - name: 装配自持态附件
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          version="${GITHUB_REF_NAME#v}"
          "$root/Shim/carriers/selfhosted-linux/deploy.sh" "$root/stage-selfhosted-linux" shim-only "$version"

          # 启动器要 0755；modes 同时写进 zip 根的 sei.json 与索引条目，两边交叉校验。
          jq -n --arg version "$version" '{
            schemaVersion: 3,
            name: "hosihikari-hosting",
            version: $version,
            dependencies: [{ name: "hosihikari", version: "[2.0.0,3.0.0)" }],
            prerequisites: [],
            optionalPeers: [],
            conflicts: [],
            artifact: {
              rid: "linux-x64",
              dependencies: [],
              prerequisites: [{ name: "hosihikari-hosting-selfhosted", version: "*" }],
              optionalPeers: [],
              conflicts: [],
              layout: "root",
              modes: { "hosihikari-server": "0755" }
            }
          }' > "$root/stage-selfhosted-linux/sei.json"

          mkdir -p "$root/out"
          (cd "$root/stage-selfhosted-linux" && zip -qr "$root/out/hosihikari-selfhosted-linux-x64.zip" hosihikari-server plugins/hosihikari sei.json)

          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'hosihikari-server'
          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'sei.json'
          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'plugins/hosihikari/libhosihikari.so'
          unzip -l "$root/out/hosihikari-selfhosted-linux-x64.zip" | grep -q 'plugins/hosihikari/hosihikari.json'

          ls -l "$root/out"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: out/*.zip

  release:
    name: 发 release
    needs: [windows-assets, linux-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: out

      - name: 发 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workspace 根不是 git 仓库（几份 checkout 各在自己的子目录里），
          # 所以仓库要显式给：否则 --generate-notes 找不到上下文。
          gh release create "${{ github.ref_name }}" out/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes

      # 发布后把这一版作为 sei 提交给官方索引：一个版本、五个附件，构件的
      # prerequisites 指向同名的 bundle sei。跨仓提交用 SEI_SUBMISSION_TOKEN；没配就跳过。
      - name: 提交 SeiIndex
        env:
          GH_TOKEN: ${{ secrets.SEI_SUBMISSION_TOKEN }}
          VERSION: ${{ github.ref_name }}
          INDEX_REPO: Hosihikari/SeiIndex
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::SEI_SUBMISSION_TOKEN 未配置，跳过 SeiIndex 提交"
            exit 0
          fi

          version="${VERSION#v}"
          title="[sei] hosihikari-hosting $version"
          existing=$(gh issue list --repo "$INDEX_REPO" --state all --limit 200 \
            --json title --jq '.[].title' | grep -Fxc "$title" || true)
          if [ "$existing" != "0" ]; then
            echo "::notice::SeiIndex already has an issue titled '$title'"
            exit 0
          fi

          artifact() {
            local asset="$1" carrier="$2" rid="$3" modes="${4:-}"
            local file="out/hosihikari-$asset.zip"
            local sha size
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(wc -c < "$file")
            jq -n --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/hosihikari-$asset.zip" \
                  --arg sha "$sha" --argjson size "$size" \
                  --arg carrier "$carrier" --arg rid "$rid" --arg modes "$modes" \
                  '{ rid: $rid, dependencies: [], prerequisites: [{ name: $carrier, version: "*" }],
                     optionalPeers: [], conflicts: [], layout: "root",
                     source: { url: $url, sha256: $sha, size: $size } }
                   + (if $modes == "" then {} else { modes: ($modes | fromjson) } end)'
          }

          artifacts=$(jq -s '.' \
            <(artifact levilamina-windows-x64 hosihikari-hosting-levilamina win-x64) \
            <(artifact endstone-windows-x64 hosihikari-hosting-endstone win-x64) \
            <(artifact endstone-linux-x64 hosihikari-hosting-endstone linux-x64) \
            <(artifact selfhosted-linux-x64 hosihikari-hosting-selfhosted linux-x64 '{"hosihikari-server":"0755"}') \
            <(artifact selfhosted-windows-x64 hosihikari-hosting-selfhosted win-x64))

          entry=$(jq -n --arg version "$version" --argjson artifacts "$artifacts" '{
            version: $version,
            dependencies: [{ name: "hosihikari", version: "[2.0.0,3.0.0)" }],
            prerequisites: [],
            optionalPeers: [],
            conflicts: [],
            artifacts: $artifacts
          }')

          body=$(printf '### Sei name\n\nhosihikari-hosting\n\n### Version entry (JSON)\n\n```json\n%s\n```\n' "$entry")
          gh issue create --repo "$INDEX_REPO" --title "$title" --body "$body"
